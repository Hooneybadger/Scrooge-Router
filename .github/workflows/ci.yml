name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 전체 테스트
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src:baselines
        # 런타임 검증은 group/other 쓰기 가능한 경로를 거부하므로 umask를 고정합니다.
        run: |
          umask 0022
          python -m unittest discover -s tests -p 'test_*.py'

  research:
    name: 실험 코드 임포트
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: 의존성 설치
        run: python -m pip install -r research/requirements.txt
      # 실험 실행은 공개 데이터 materialization이 필요하므로 CI에서는
      # 모듈이 깨지지 않았는지까지만 확인합니다.
      - name: 모듈 임포트 확인
        env:
          PYTHONPATH: .:src:baselines
        run: |
          python - <<'PY'
          import importlib, pathlib
          for path in sorted(pathlib.Path("research").rglob("*.py")):
              importlib.import_module(str(path.with_suffix("")).replace("/", "."))
          PY

  lint:
    name: 정적 검사
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: ruff 설치
        run: python -m pip install ruff==0.16.3
      - name: ruff 검사
        run: ruff check .

  license:
    name: 라이선스 검사
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: REUSE 설치
        run: python -m pip install reuse==6.2.0
      - name: REUSE 준수 검사
        run: reuse lint
